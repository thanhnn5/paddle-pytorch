Global:
  model_name: PP-OCRv6_medium_det # To use static model for inference.
  debug: false
  use_gpu: true
  device: gpu
  use_tensorboard: false
  use_ema: true             # PP-OCRv6: eval/save EMA weights (torchocr/utils/ema.py)
  ema_decay: 0.9996         # Paddle: tiny 0.9998 / small 0.9997 / medium 0.9996
  ema_decay_type: threshold
  epoch_num: &epoch_num 100
  log_smooth_window: 20
  print_batch_step: 100
  save_model_dir: ./output/PP-OCRv6_medium_det
  output_dir: ./output/PP-OCRv6_medium_det
  save_epoch_step: 10
  eval_batch_step:
  - 0
  - 1500
  cal_metric_during_train: false
  checkpoints:
  pretrained_model:  # e.g. converted PP-OCRv6_medium_det_pretrained.pdparams (see tools/deployment/convert_paddle_weights.py)
  save_inference_dir: null
  use_visualdl: false
  infer_img: doc/imgs_en/img_10.jpg
  save_res_path: ./checkpoints/det_db/predicts_db.txt
  d2s_train_image_shape: [3, 640, 640]
  distributed: true

Architecture:
  model_type: det
  algorithm: DB
  Transform: null
  Backbone:
    name: PPLCNetV4
    det: True
    model_size: medium
  Neck:
    name: RepLKPAN
    out_channels: 256
    intracl: True
  Head:
    name: DBHead
    k: 50
    fix_nan: True
    aux_in_channels: 256  # PP-OCRv6 aux heads (train only); keeps .pdparams keys 1:1

Loss:  # PP-OCRv6 (Paddle): Dice+Focal on shrink/binary maps + aux-head deep supervision
  name: DBLoss
  main_loss_type: DiceFocalLoss
  alpha: 5
  beta: 10
  focal_alpha: 0.25
  focal_gamma: 2.5
  aux_weight_p4: 0.2
  aux_weight_p3: 0.3
  aux_weight_p2: 0.4

Optimizer:
  name: Adam
  # beta1: 0.9
  # beta2: 0.999
  betas: [0.9, 0.999]  # PyTorch使用betas参数
  # lr:
  #   name: Cosine
  #   learning_rate: 0.001 #(8*8c)
  #   warmup_epoch: 
  lr: 0.0001
  # regularizer:
  #   name: L2
  #   factor: 5.0e-05
  weight_decay: 0.0001  # L2正则化对应weight_decay

LRScheduler:
  name: CosineAnnealingLR
  warmup_epoch: 2

PostProcess:  # PaddleOCR PP-OCRv6 defaults
  name: DBPostProcess
  thresh: 0.2
  box_thresh: 0.45
  max_candidates: 3000
  unclip_ratio: 1.4

Metric:
  name: DetMetric
  main_indicator: hmean

Train:
  dataset:
    name: SimpleDataSet
    data_dir: ./train_data/icdar2015/text_localization/
    label_file_list:
      - ./train_data/icdar2015/text_localization/train_icdar2015_label.txt
    ratio_list: [1.0]
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - DetLabelEncode: null
    - CopyPaste: null
    - ColorJitter:
        brightness: 0.4
        contrast: 0.4
        saturation: 0.7
        hue: 0.1
    - IaaAugment:
        backend: albumentations  # Paddle's implementation (imgaug has no Affine p/fit_output)
        augmenter_args:
        - type: Fliplr
          args:
            p: 0.5
        - type: Affine
          args:
            p: 0.5
            rotate:
            - -45
            - 45
            fit_output: true
        - type: Resize
          args:
            size:
            - 0.1
            - 2
    - RandomPerspective:
        prob: 0.3
        scale: 0.0
        shear: 20.0
        perspective: 0.001
        fit_output: true
        fill_value: [0, 0, 0]
    - RandomCrop:
        size:
        - 640
        - 640
        max_tries: 50
        keep_ratio: true
    - MakeBorderMap:
        shrink_ratio: 0.4
        thresh_min: 0.3
        thresh_max: 0.7
        total_epoch: *epoch_num
    - MakeShrinkMap:
        shrink_ratio: 0.4
        min_text_size: 8
        total_epoch: *epoch_num
    - NormalizeImage:
        scale: 1./255.
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
        order: hwc
    - ToCHWImage: null
    - KeepKeys:
        keep_keys:
        - image
        - threshold_map
        - threshold_mask
        - shrink_map
        - shrink_mask
    # Paddle only advances the epoch seen by MakeBorderMap/MakeShrinkMap
    # (shrink_ratio 0.4 -> 0.6 over total_epoch) when some ratio_list entry
    # is < 1. Set true to rebuild the loader every epoch and enable the ramp.
    # need_reset_each_epoch: true
  loader:
    shuffle: true
    drop_last: false
    batch_size_per_card: 8
    num_workers: 8

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./train_data/icdar2015/text_localization/
    label_file_list:
      - ./train_data/icdar2015/text_localization/test_icdar2015_label.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - DetLabelEncode: null
    - DetResizeForTest:
    - NormalizeImage:
        scale: 1./255.
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
        order: hwc
    - ToCHWImage: null
    - KeepKeys:
        keep_keys:
        - image
        - shape
        - polys
        - ignore_tags
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 1
    num_workers: 2
profiler_options: null
