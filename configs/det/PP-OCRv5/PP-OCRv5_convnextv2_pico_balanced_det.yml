Global:
  model_name: PP-OCRv5_convnextv2_pico_balanced_det
  debug: false
  use_gpu: true
  device: gpu
  use_tensorboard: false
  epoch_num: &epoch_num 100
  log_smooth_window: 20
  print_batch_step: 100
  save_model_dir: ./output/PP-OCRv5_convnextv2_pico_balanced_det
  output_dir: ./output/PP-OCRv5_convnextv2_pico_balanced_det
  save_epoch_step: 10
  eval_batch_step:
  - 0
  - 1500
  cal_metric_during_train: false
  checkpoints:
  pretrained_model:        # set via -o Global.pretrained_model=...
  save_inference_dir: null
  use_visualdl: false
  infer_img: doc/imgs_en/img_10.jpg
  save_res_path: ./checkpoints/det_db/predicts_db.txt
  distributed: false

# Balanced pico head config — same design rule as the femto-balanced variant
# applied to the bigger pico backbone (~70% more capacity than femto).
#
# Sizes (total / backbone / neck+head / NH share):
#   *_femto_balanced_det.yml  : 5.98M / 4.85M / 1.14M / 19%   BB:NH 4.25:1
#   THIS (pico + LKPAN 128 + PFHL small) : 10.57M / 8.55M / 2.02M / 19%  BB:NH 4.24:1
#   teacher (ConvNeXt-tiny + LKPAN 256 + PFHL large) : 35.78M / 22% / 3.49:1
#
# Design rule: neck out_channels = 2x backbone stage-1 width.
#   - Femto stage-1 = 48 -> LKPAN out_channels = 96
#   - Pico  stage-1 = 64 -> LKPAN out_channels = 128
# This preserves the femto-balanced proportions (~19% NH share, ~4.2:1 BB:NH)
# at the larger backbone.
Architecture:
  model_type: det
  algorithm: DB
  Transform: null
  Backbone:
    name: ConvNeXtV2Backbone
    size: pico                    # 8.55M params, dims [64,128,256,512]
    pretrained: false             # load from Global.pretrained_model
    finetune: true
  Neck:
    name: LKPAN
    out_channels: 128             # 2x pico stage-1 width (64), matches design rule
    intracl: true
  Head:
    name: PFHeadLocal
    k: 50
    mode: "small"

Loss:
  name: DBLoss
  balance_loss: true
  main_loss_type: DiceLoss
  alpha: 5
  beta: 10
  ohem_ratio: 3

Optimizer:
  name: Adam
  betas: [0.9, 0.999]
  lr: 0.0005
  weight_decay: 0.0001
  backbone_lr_mult: 0.1           # distilled backbone: 5e-5
  neck_lr_mult: 1.0
  head_lr_mult: 1.0

LRScheduler:
  name: CosineAnnealingLR
  warmup_epoch: 2

PostProcess:
  name: DBPostProcess
  thresh: 0.3
  box_thresh: 0.6
  max_candidates: 1000
  unclip_ratio: 1.5

Metric:
  name: DetMetric
  main_indicator: hmean

Train:
  dataset:
    name: SimpleDataSet
    data_dir: ./train_data/icdar2015/text_localization/
    label_file_list:
      - ./train_data/icdar2015/text_localization/train_icdar2015_label.txt
    ratio_list: [1.0]
    transforms:
    - DecodeImage:
        img_mode: RGB
        channel_first: false
    - DetLabelEncode: null
    - CopyPaste: null
    - IaaAugment:
        augmenter_args:
        - type: Fliplr
          args:
            p: 0.5
        - type: Affine
          args:
            rotate:
            - -10
            - 10
        - type: Resize
          args:
            size:
            - 0.5
            - 3
    - EastRandomCropData:
        size:
        - 640
        - 640
        max_tries: 50
        keep_ratio: true
    - MakeBorderMap:
        shrink_ratio: 0.4
        thresh_min: 0.3
        thresh_max: 0.7
        total_epoch: *epoch_num
    - MakeShrinkMap:
        shrink_ratio: 0.4
        min_text_size: 8
        total_epoch: *epoch_num
    - NormalizeImage:
        scale: 1./255.
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
        order: hwc
    - ToCHWImage: null
    - KeepKeys:
        keep_keys:
        - image
        - threshold_map
        - threshold_mask
        - shrink_map
        - shrink_mask
  loader:
    shuffle: true
    drop_last: false
    batch_size_per_card: 16
    num_workers: 8

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./train_data/icdar2015/text_localization/
    label_file_list:
      - ./train_data/icdar2015/text_localization/test_icdar2015_label.txt
    transforms:
    - DecodeImage:
        img_mode: RGB
        channel_first: false
    - DetLabelEncode: null
    - DetResizeForTest:
    - NormalizeImage:
        scale: 1./255.
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
        order: hwc
    - ToCHWImage: null
    - KeepKeys:
        keep_keys:
        - image
        - shape
        - polys
        - ignore_tags
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 1
    num_workers: 2
profiler_options: null
