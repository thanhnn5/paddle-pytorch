Global:
  model_name: PP-OCRv5_convnext_base_det
  debug: false
  use_gpu: true
  device: gpu
  use_tensorboard: false
  epoch_num: &epoch_num 100
  log_smooth_window: 20
  print_batch_step: 100
  save_model_dir: ./output/PP-OCRv5_convnext_base_det
  output_dir: ./output/PP-OCRv5_convnext_base_det
  save_epoch_step: 10
  eval_batch_step:
  - 0
  - 1500
  cal_metric_during_train: false
  checkpoints:
  pretrained_model:
  save_inference_dir: null
  use_visualdl: false
  infer_img: doc/imgs_en/img_10.jpg
  save_res_path: ./checkpoints/det_db/predicts_db.txt
  distributed: false

Export:
  export_dir:
  export_shape: [ 1, 3, 640, 640 ]
  dynamic_axes: [ 0, 2, 3 ]

Architecture:
  model_type: det
  algorithm: DB
  Transform: null
  Backbone:
    name: ConvNeXtDetBackbone
    # ~88M params, hidden_sizes [128, 256, 512, 1024] (vs tiny's [96,192,384,768])
    model_name: facebook/dinov3-convnext-base-pretrain-lvd1689m
    pretrained: true
    finetune: true
  Neck:
    # Repo scaling rule: out_channels = 2x backbone stage-1 width (C1).
    #   femto C1=48 -> 96 | pico C1=64 -> 128 | base C1=128 -> 256
    # LKPAN then runs each level at out_channels//4 = 64 before the 4-way concat,
    # so the head sees 256 channels.
    name: LKPAN
    out_channels: 256
    intracl: true
  Head:
    # in_channels = neck out_channels = 256. "large" keeps the LocalModule at
    # in//4 = 64 (vs "small" -> in//8 = 32); at 256 the wide variant is worth it,
    # which is why the femto/pico configs drop to "small" and this one does not.
    name: PFHeadLocal
    k: 50
    mode: "large"

Loss:
  name: DBLoss
  balance_loss: true
  main_loss_type: DiceLoss
  alpha: 5
  beta: 10
  ohem_ratio: 3

Optimizer:
  name: Adam
  betas: [0.9, 0.999]
  lr: 0.0001
  weight_decay: 0.05              # ConvNeXt-Base is heavily over-parameterised
                                  # for this dataset; ConvNeXt recipes use 0.05.
  # A 88M DINOv3-pretrained backbone paired with a randomly-initialised
  # LKPAN/PFHeadLocal: keep the backbone slow so the fresh neck/head catch up
  # without washing out the pretrained features.
  backbone_lr_mult: 0.1           # backbone gets 1e-5
  neck_lr_mult: 1.0               # 1e-4
  head_lr_mult: 1.0               # 1e-4
  # Freeze backbone entirely (no gradient, not added to optimizer):
  # freeze_backbone: false

LRScheduler:
  name: CosineAnnealingLR
  warmup_epoch: 2

PostProcess:
  name: DBPostProcess
  thresh: 0.3
  box_thresh: 0.6
  max_candidates: 1000
  unclip_ratio: 1.5

Metric:
  name: DetMetric
  main_indicator: hmean

Train:
  dataset:
    name: SimpleDataSet
    data_dir: ./train_data/icdar2015/text_localization/
    label_file_list:
      - ./train_data/icdar2015/text_localization/train_icdar2015_label.txt
    ratio_list: [1.0]
    transforms:
    - DecodeImage:
        img_mode: RGB
        channel_first: false
    - DetLabelEncode: null
    - CopyPaste: null
    - IaaAugment:
        augmenter_args:
        - type: Fliplr
          args:
            p: 0.5
        - type: Affine
          args:
            rotate:
            - -10
            - 10
        - type: Resize
          args:
            size:
            - 0.5
            - 3
    - EastRandomCropData:
        size:
        - 640
        - 640
        max_tries: 50
        keep_ratio: true
    - MakeBorderMap:
        shrink_ratio: 0.4
        thresh_min: 0.3
        thresh_max: 0.7
        total_epoch: *epoch_num
    - MakeShrinkMap:
        shrink_ratio: 0.4
        min_text_size: 8
        total_epoch: *epoch_num
    - NormalizeImage:
        scale: 1./255.
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
        order: hwc
    - ToCHWImage: null
    - KeepKeys:
        keep_keys:
        - image
        - threshold_map
        - threshold_mask
        - shrink_map
        - shrink_mask
  loader:
    shuffle: true
    drop_last: false
    batch_size_per_card: 4        # base is ~3x tiny's activation footprint at
                                  # 640x640; halve the batch to fit. Raise back
                                  # to 8 if your GPU has the memory.
    num_workers: 8

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./train_data/icdar2015/text_localization/
    label_file_list:
      - ./train_data/icdar2015/text_localization/test_icdar2015_label.txt
    transforms:
    - DecodeImage:
        img_mode: RGB
        channel_first: false
    - DetLabelEncode: null
    - DetResizeForTest:
    - NormalizeImage:
        scale: 1./255.
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
        order: hwc
    - ToCHWImage: null
    - KeepKeys:
        keep_keys:
        - image
        - shape
        - polys
        - ignore_tags
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 1
    num_workers: 2
profiler_options: null
