Global:
  model_name: PP-OCRv5_convnextv2_femto_balanced_det
  debug: false
  use_gpu: true
  device: gpu
  use_tensorboard: false
  epoch_num: &epoch_num 100
  log_smooth_window: 20
  print_batch_step: 100
  save_model_dir: ./output/PP-OCRv5_convnextv2_femto_balanced_det
  output_dir: ./output/PP-OCRv5_convnextv2_femto_balanced_det
  save_epoch_step: 10
  eval_batch_step:
  - 0
  - 1500
  cal_metric_during_train: false
  checkpoints:
  pretrained_model:        # set via -o Global.pretrained_model=...
  save_inference_dir: null
  use_visualdl: false
  infer_img: doc/imgs_en/img_10.jpg
  save_res_path: ./checkpoints/det_db/predicts_db.txt
  distributed: false

# Balanced femto head config — middle ground between the two existing femto
# configs:
#   *_femto_det.yml         (LKPAN 256ch + PFHL "large") : 12.6M total, head 62%
#   *_femto_mobile_det.yml  (RSEFPN  96ch + DBHead)      :  5.1M total, head  4%
#   THIS (LKPAN 96ch + PFHL "small")                     :  ~6.5M est, head ~25%
#
# Rationale: PP-OCRv5-mobile saw recall drop with the lightest head, suggesting
# DBHead is too thin to recover from any residual backbone weakness. LKPAN's
# multi-scale fusion and PFHL's CBN refinement should help recall without the
# parameter blowup of the 256-channel variant. Channel widths (96) match
# femto's stage-1 output to avoid wasteful upscaling in the neck.
Architecture:
  model_type: det
  algorithm: DB
  Transform: null
  Backbone:
    name: ConvNeXtV2Backbone
    size: femto                   # 5.2M params, dims [48,96,192,384]
    pretrained: false             # load from Global.pretrained_model
    finetune: true
  Neck:
    name: LKPAN
    out_channels: 96              # was 256 in *_femto_det.yml — matches femto width
    intracl: true
  Head:
    name: PFHeadLocal
    k: 50
    mode: "small"                 # was "large" — halves CBN module width

Loss:
  name: DBLoss
  balance_loss: true
  main_loss_type: DiceLoss
  alpha: 5
  beta: 10
  ohem_ratio: 3

# Stage-3 auxiliary distillation. Disabled by default; enable via
# `-o AuxDistill.enabled=true ...`. See docs/stage3_auxiliary_distill.md.
AuxDistill:
  enabled: false
  teacher_ckpt: weights/dinov3/convnext_det_unfreeze.pth
  teacher_config: configs/det/PP-OCRv5/PP-OCRv5_convnext_det.yml
  align_stages: [2, 3]
  feat_weight: 5.0
  logit_weight: 0.0

Optimizer:
  name: Adam
  betas: [0.9, 0.999]
  lr: 0.0005
  weight_decay: 0.0001
  backbone_lr_mult: 0.1           # distilled backbone: 5e-5
  neck_lr_mult: 1.0
  head_lr_mult: 1.0

LRScheduler:
  name: CosineAnnealingLR
  warmup_epoch: 2

PostProcess:
  name: DBPostProcess
  thresh: 0.3
  box_thresh: 0.6
  max_candidates: 1000
  unclip_ratio: 1.5

Metric:
  name: DetMetric
  main_indicator: hmean

Train:
  dataset:
    name: SimpleDataSet
    data_dir: ./train_data/icdar2015/text_localization/
    label_file_list:
      - ./train_data/icdar2015/text_localization/train_icdar2015_label.txt
    ratio_list: [1.0]
    transforms:
    - DecodeImage:
        img_mode: RGB
        channel_first: false
    - DetLabelEncode: null
    - CopyPaste: null
    - IaaAugment:
        augmenter_args:
        - type: Fliplr
          args:
            p: 0.5
        - type: Affine
          args:
            rotate:
            - -10
            - 10
        - type: Resize
          args:
            size:
            - 0.5
            - 3
    - EastRandomCropData:
        size:
        - 640
        - 640
        max_tries: 50
        keep_ratio: true
    - MakeBorderMap:
        shrink_ratio: 0.4
        thresh_min: 0.3
        thresh_max: 0.7
        total_epoch: *epoch_num
    - MakeShrinkMap:
        shrink_ratio: 0.4
        min_text_size: 8
        total_epoch: *epoch_num
    - NormalizeImage:
        scale: 1./255.
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
        order: hwc
    - ToCHWImage: null
    - KeepKeys:
        keep_keys:
        - image
        - threshold_map
        - threshold_mask
        - shrink_map
        - shrink_mask
  loader:
    shuffle: true
    drop_last: false
    batch_size_per_card: 16
    num_workers: 8

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./train_data/icdar2015/text_localization/
    label_file_list:
      - ./train_data/icdar2015/text_localization/test_icdar2015_label.txt
    transforms:
    - DecodeImage:
        img_mode: RGB
        channel_first: false
    - DetLabelEncode: null
    - DetResizeForTest:
    - NormalizeImage:
        scale: 1./255.
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
        order: hwc
    - ToCHWImage: null
    - KeepKeys:
        keep_keys:
        - image
        - shape
        - polys
        - ignore_tags
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 1
    num_workers: 2
profiler_options: null
